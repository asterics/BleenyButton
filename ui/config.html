<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microcontroller Configurator</title>

    <style>
        @font-face {
            font-family: "CustomFont";
            src: url("Jost-Bold.ttf") format("truetype");
        }

        body {
            font-family: "CustomFont", Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }

        header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        header img {
            height: 60px;
            margin-right: 20px;
        }

        h1 {
            margin: 0;
        }

        button {
            padding: 6px 14px;
            cursor: pointer;
        }

        .config-item {
            background: #ffffff;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .description {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 6px;
        }

        #status {
            margin-top: 15px;
            font-style: italic;
            white-space: pre-line;
        }
    
    </style>
</head>

<body>

<header>
    <img src="logo.png" alt="Logo">
    <h1 id="deviceName">Disconnected</h1>
</header>

<button id="connectBtn">Connect</button>

<div id="configArea"></div>
<div id="status">Idle</div>

<script>
let port, reader, writer;
let listening = false;
let readBuffer = "";
let lineQueue = [];
let parameters = [];

const configArea = document.getElementById("configArea");
const statusEl = document.getElementById("status");
const deviceNameEl = document.getElementById("deviceName");

document.getElementById("connectBtn").addEventListener("click", connect);

/* ================= SERIAL CORE ================= */

async function connect() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);

        reader = textDecoder.readable.getReader();
        writer = port.writable.getWriter();

        startListening();

        statusEl.textContent = "Connected, requesting command list…";
        await sendLine("?");

        const lines = await collectLines(200);
        parseResponse(lines);
        renderUI();

        statusEl.textContent = "Ready\n";

    } catch (err) {
        statusEl.textContent = "Connection failed: " + err;
    }
}

async function startListening() {
    if (listening) return;
    listening = true;

    while (listening) {
        try {
            const { value, done } = await reader.read();
            if (done) break;

            value.split("").forEach(ch => {
                readBuffer += ch;
                if (ch === "\n") {
                    const line = readBuffer.trim();
                    readBuffer = "";
                    if (line) {
                        console.log(line);
                        lineQueue.push(line);
                        statusEl.textContent += "Received:" + line + "\n";
                    }
                }
            });

        } catch (e) {
            console.warn("Serial read error:", e);
            listening = false;
            break;
        }
    }
}

async function collectLines(idleMs = 150) {
    return new Promise(resolve => {
        let lastLen = lineQueue.length;

        const timer = setInterval(() => {
            if (lineQueue.length !== lastLen) {
                lastLen = lineQueue.length;
                return;
            }

            if (lineQueue.length) {
                clearInterval(timer);
                const lines = [...lineQueue];
                lineQueue.length = 0;
                resolve(lines);
            }
        }, idleMs);
    });
}

async function sendLine(text) {
    await writer.write(new TextEncoder().encode(text + "\n"));
}

/* ================= PROTOCOL PARSING ================= */

function parseResponse(lines) {
    parameters = [];
    if (!lines.length) return;

    deviceNameEl.textContent = lines[0];

    lines.slice(1).forEach(line => {
        const parts = line.split(":");
        if (parts.length < 3) return;

        parameters.push({
            cmd: parts[0],
            type: parts[1].replace(/[<>]/g, ""),
            description: parts[2],
            extra: parts[3] || null,
            current: parts[4] || null
        });
    });
}

/* ================= UI ================= */

function renderUI() {
    configArea.innerHTML = "";

    parameters.forEach(p => {
        const div = document.createElement("div");
        div.className = "config-item";

        const title = document.createElement("strong");
        title.textContent = p.cmd;

        const desc = document.createElement("div");
        desc.className = "description";
        desc.textContent = p.description;

        div.appendChild(title);
        div.appendChild(desc);

        let el = null;
        
        const btn = document.createElement("button");
        btn.textContent = "Update";

        switch (p.type) {
            case "int":
                el = document.createElement("input");
                el.type = "number";
                applyRange(el, p.extra);
                if(p.current) el.value = p.current;
                btn.addEventListener("click", () => sendValue(p.cmd, el.value));
                break;

            case "float":
                el = document.createElement("input");
                el.type = "number";
                el.step = "any";
                applyRange(el, p.extra);
                if(p.current) el.value = p.current;
                btn.addEventListener("click", () => sendValue(p.cmd, el.value));
                break;

            case "bool":
                el = document.createElement("input");
                el.type = "checkbox";
                if(p.current) el.checked = 1;
                btn.addEventListener("click", () => sendValue(p.cmd, el.checked ? 1 : 0));
                break;

            case "enum":
                el = document.createElement("select");
                p.extra.split(",").forEach(v => {
                    const opt = document.createElement("option");
                    opt.value = v;
                    opt.textContent = v;
                    el.appendChild(opt);
                });
                if(p.current) el.selectedIndex = p.current;
                btn.addEventListener("click", () => sendValue(p.cmd, el.selectedIndex));
                break;

            case "keycombo": {
                el = document.createElement("input");
                el.type = "text";
                el.readOnly = true;
                el.placeholder = "Click here, then press a key combination";
                el.style.cssText = "cursor:pointer;min-width:240px;";
                let kc = parseInt(p.extra) || 0;
                let km = parseInt(p.current) || 0;
                if (kc) el.value = formatKeyCombo(kc, km);
                el.addEventListener("focus", () => { el.style.outline = "2px solid #0078d4"; });
                el.addEventListener("blur",  () => { el.style.outline = ""; });
                el.addEventListener("keydown", (e) => {
                    e.preventDefault();
                    if (["Control","Alt","Shift","Meta"].includes(e.key)) return;
                    const hid = browserCodeToHID(e.code);
                    if (hid === undefined) { el.value = "(unsupported: " + e.code + ")"; return; }
                    let mod = 0;
                    if (e.ctrlKey)  mod |= 0x01;
                    if (e.shiftKey) mod |= 0x02;
                    if (e.altKey)   mod |= 0x04;
                    if (e.metaKey)  mod |= 0x08;
                    kc = hid; km = mod;
                    el.value = formatKeyCombo(hid, mod);
                });
                btn.addEventListener("click", () => {
                    sendLine(p.cmd + ":" + kc + ":" + km);
                    statusEl.textContent += "Sent key combo: " + el.value + "\n";
                });
                break;
            }

            case "string":
                el = document.createElement("input");
                el.type = "text";
                if(p.current) el.value = p.current;
                btn.addEventListener("click", () => sendValue(p.cmd, el.value));
                break;

            case "none":
                btn.textContent = "Execute";
                btn.addEventListener("click", () => sendLine(p.cmd));
                break;
            case "info":
                btn.style.visibility = "hidden";
                break;
        }

        if(btn) div.appendChild(btn);

        if (el) {
            div.appendChild(el);
        }

        configArea.appendChild(div);
    });
}

function applyRange(input, range) {
    if (!range) return;
    const [min, max] = range.split("-");
    input.min = min;
    input.max = max;
    input.placeholder = `${min} – ${max}`;
}

async function sendValue(cmd, value) {
    if (value === "" || value === undefined) return;
    await sendLine(`${cmd}:${value}`);
    statusEl.textContent += `Sent ${cmd}:${value}` + "\n";
}

/* ================= HID KEY HELPERS ================= */

const HID_KEY_MAP = {
    'KeyA':{hid:0x04,name:'A'}, 'KeyB':{hid:0x05,name:'B'}, 'KeyC':{hid:0x06,name:'C'},
    'KeyD':{hid:0x07,name:'D'}, 'KeyE':{hid:0x08,name:'E'}, 'KeyF':{hid:0x09,name:'F'},
    'KeyG':{hid:0x0A,name:'G'}, 'KeyH':{hid:0x0B,name:'H'}, 'KeyI':{hid:0x0C,name:'I'},
    'KeyJ':{hid:0x0D,name:'J'}, 'KeyK':{hid:0x0E,name:'K'}, 'KeyL':{hid:0x0F,name:'L'},
    'KeyM':{hid:0x10,name:'M'}, 'KeyN':{hid:0x11,name:'N'}, 'KeyO':{hid:0x12,name:'O'},
    'KeyP':{hid:0x13,name:'P'}, 'KeyQ':{hid:0x14,name:'Q'}, 'KeyR':{hid:0x15,name:'R'},
    'KeyS':{hid:0x16,name:'S'}, 'KeyT':{hid:0x17,name:'T'}, 'KeyU':{hid:0x18,name:'U'},
    'KeyV':{hid:0x19,name:'V'}, 'KeyW':{hid:0x1A,name:'W'}, 'KeyX':{hid:0x1B,name:'X'},
    'KeyY':{hid:0x1C,name:'Y'}, 'KeyZ':{hid:0x1D,name:'Z'},
    'Digit1':{hid:0x1E,name:'1'}, 'Digit2':{hid:0x1F,name:'2'}, 'Digit3':{hid:0x20,name:'3'},
    'Digit4':{hid:0x21,name:'4'}, 'Digit5':{hid:0x22,name:'5'}, 'Digit6':{hid:0x23,name:'6'},
    'Digit7':{hid:0x24,name:'7'}, 'Digit8':{hid:0x25,name:'8'}, 'Digit9':{hid:0x26,name:'9'},
    'Digit0':{hid:0x27,name:'0'},
    'Enter':{hid:0x28,name:'Enter'}, 'Escape':{hid:0x29,name:'Esc'}, 'Backspace':{hid:0x2A,name:'Backspace'},
    'Tab':{hid:0x2B,name:'Tab'}, 'Space':{hid:0x2C,name:'Space'},
    'Minus':{hid:0x2D,name:'-'}, 'Equal':{hid:0x2E,name:'='}, 'BracketLeft':{hid:0x2F,name:'['},
    'BracketRight':{hid:0x30,name:']'}, 'Backslash':{hid:0x31,name:'\\'},
    'Semicolon':{hid:0x33,name:';'}, 'Quote':{hid:0x34,name:"'"}, 'Backquote':{hid:0x35,name:'`'},
    'Comma':{hid:0x36,name:','}, 'Period':{hid:0x37,name:'.'}, 'Slash':{hid:0x38,name:'/'},
    'CapsLock':{hid:0x39,name:'CapsLock'},
    'F1':{hid:0x3A,name:'F1'},   'F2':{hid:0x3B,name:'F2'},   'F3':{hid:0x3C,name:'F3'},
    'F4':{hid:0x3D,name:'F4'},   'F5':{hid:0x3E,name:'F5'},   'F6':{hid:0x3F,name:'F6'},
    'F7':{hid:0x40,name:'F7'},   'F8':{hid:0x41,name:'F8'},   'F9':{hid:0x42,name:'F9'},
    'F10':{hid:0x43,name:'F10'}, 'F11':{hid:0x44,name:'F11'}, 'F12':{hid:0x45,name:'F12'},
    'PrintScreen':{hid:0x46,name:'PrtSc'}, 'ScrollLock':{hid:0x47,name:'ScrLk'}, 'Pause':{hid:0x48,name:'Pause'},
    'Insert':{hid:0x49,name:'Insert'}, 'Home':{hid:0x4A,name:'Home'}, 'PageUp':{hid:0x4B,name:'PgUp'},
    'Delete':{hid:0x4C,name:'Delete'}, 'End':{hid:0x4D,name:'End'}, 'PageDown':{hid:0x4E,name:'PgDn'},
    'ArrowRight':{hid:0x4F,name:'→'}, 'ArrowLeft':{hid:0x50,name:'←'},
    'ArrowDown':{hid:0x51,name:'↓'}, 'ArrowUp':{hid:0x52,name:'↑'},
    'NumLock':{hid:0x53,name:'NumLock'},
    'NumpadDivide':{hid:0x54,name:'Num/'}, 'NumpadMultiply':{hid:0x55,name:'Num*'},
    'NumpadSubtract':{hid:0x56,name:'Num-'}, 'NumpadAdd':{hid:0x57,name:'Num+'},
    'NumpadEnter':{hid:0x58,name:'NumEnter'},
    'Numpad1':{hid:0x59,name:'Num1'}, 'Numpad2':{hid:0x5A,name:'Num2'}, 'Numpad3':{hid:0x5B,name:'Num3'},
    'Numpad4':{hid:0x5C,name:'Num4'}, 'Numpad5':{hid:0x5D,name:'Num5'}, 'Numpad6':{hid:0x5E,name:'Num6'},
    'Numpad7':{hid:0x5F,name:'Num7'}, 'Numpad8':{hid:0x60,name:'Num8'}, 'Numpad9':{hid:0x61,name:'Num9'},
    'Numpad0':{hid:0x62,name:'Num0'}, 'NumpadDecimal':{hid:0x63,name:'Num.'},
    'F13':{hid:0x68,name:'F13'}, 'F14':{hid:0x69,name:'F14'}, 'F15':{hid:0x6A,name:'F15'},
    'F16':{hid:0x6B,name:'F16'}, 'F17':{hid:0x6C,name:'F17'}, 'F18':{hid:0x6D,name:'F18'},
    'F19':{hid:0x6E,name:'F19'}, 'F20':{hid:0x6F,name:'F20'}, 'F21':{hid:0x70,name:'F21'},
    'F22':{hid:0x71,name:'F22'}, 'F23':{hid:0x72,name:'F23'}, 'F24':{hid:0x73,name:'F24'},
};

const HID_CODE_NAMES = Object.fromEntries(Object.values(HID_KEY_MAP).map(v => [v.hid, v.name]));

function browserCodeToHID(code) { return HID_KEY_MAP[code]?.hid; }

function hidKeycodeToName(hid) {
    return HID_CODE_NAMES[hid] || ('0x' + hid.toString(16).toUpperCase().padStart(2, '0'));
}

function formatKeyCombo(keycode, modifier) {
    if (!keycode) return "(none)";
    const mods = [];
    if (modifier & 0x11) mods.push('Ctrl');
    if (modifier & 0x22) mods.push('Shift');
    if (modifier & 0x44) mods.push('Alt');
    if (modifier & 0x88) mods.push('Win');
    return [...mods, hidKeycodeToName(keycode)].join('+');
}
</script>

</body>
</html>
