[env:nicenano]
platform = nordicnrf52
board = nicenano
framework = arduino
lib_deps =  https://github.com/adafruit/Adafruit_nRF52_Arduino



# use this environment for installing Adafruit nRF52 Arduino core libraries
[env:adafruit_feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
lib_deps = https://github.com/adafruit/Adafruit_nRF52_Arduino
build_flags = ; Using the NiceNano with the Adafruit Board, we need to define the necessary pins as in variant.cpp
    -DPIN_017=29 ;017 is D29
    -DPIN_020=28
    -DPIN_022=30
    -DPIN_024=1
    -DPIN_013=25
    -DPIN_015=24 
